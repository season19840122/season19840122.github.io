<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人介绍</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #e6e8eb;
      padding: 24px;
    }

    .card {
      display: flex;
      gap: 32px;
      align-items: center;
      max-width: 720px;
      width: 100%;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      width: 140px;
      height: 140px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #333;
      border: 3px solid #3a3f4a;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .tagline {
      margin-top: 8px;
      font-size: 16px;
      color: #9aa3b2;
    }

    .resume {
      margin-top: 20px;
      list-style: none;
      border-top: 1px solid #2a2f3a;
      padding-top: 16px;
    }

    .resume li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.6;
      color: #c6ccd6;
    }

    .resume li:last-child {
      margin-bottom: 0;
    }

    .resume li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4a90d9;
    }

    @media (max-width: 560px) {
      .card {
        flex-direction: column;
        text-align: center;
        padding: 32px 24px;
      }

      .resume li {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar" aria-label="头像占位"></div>
    <div class="info">
      <h1 class="name">你的名字</h1>
      <p class="tagline">一句话简介：热爱技术，专注打造简洁可靠的产品。</p>
      <ul class="resume">
        <li>履历一：负责核心业务系统的设计与开发</li>
        <li>履历二：主导过多个从 0 到 1 的项目落地</li>
        <li>履历三：关注工程效率与代码质量，乐于分享</li>
      </ul>
    </div>
  </div>
</body>
</html>
